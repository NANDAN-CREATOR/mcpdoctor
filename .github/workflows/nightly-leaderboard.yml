name: Nightly leaderboard
# Also triggered by scan-request.yml after each community test, so new results appear within minutes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - name: Fetch stored community results (branch may not exist yet)
        run: |
          if git ls-remote --exit-code --heads origin leaderboard-data >/dev/null 2>&1; then
            git clone --depth 1 --branch leaderboard-data "https://github.com/${{ github.repository }}.git" data
          else
            mkdir data
          fi
      - name: Scan every demo server and build the site (demo list + community results)
        run: mcpdoctor leaderboard examples/leaderboard-servers.yaml --out site --submissions data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
